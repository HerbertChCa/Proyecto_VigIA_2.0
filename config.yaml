# VigIA - configuración general
# Los tiempos están en segundos y las distancias se expresan en "alturas de persona"
# (altura de la caja de la persona), para que no dependan de la resolución de la cámara.

servidor:
  host: 127.0.0.1
  puerto: 8000

# Cámaras que se abren al iniciar. Fuente:
#   0, 1, ...            -> webcam de la laptop (índice)
#   rtsp://usuario:clave@IP:554/stream  -> cámara IP
#   ruta a un .mp4       -> video grabado (se reproduce en bucle)
camaras:
  - id: video1
    nombre: Prueba robo 1
    fuente: videos/robo1.mp4
  - id: video2
    nombre: Prueba robo 2
    fuente: videos/robo2.mp4
  - id: video3
    nombre: Prueba robo 3
    fuente: videos/robo3.mp4

modelos:
  pose: models/yolo11n-pose.pt       # personas + 17 puntos del esqueleto + seguimiento
  objetos: models/yolo11n.pt         # mochilas, bolsos, maletas y vehículos
  tamano_imagen: 480           # menor = más rápido en CPU
  tamano_imagen_objetos: 640   # los objetos son chicos: una mochila a 4 m casi no se ve a 480 (si va lento, baje a 480)
  confianza: 0.40
  # auto = si existe la versión OpenVINO de un modelo (python scripts/acelerar_modelos.py) se usa esa, 2-3 veces
  # más rápida en CPU; con tarjeta NVIDIA se usa la GPU. "no" = siempre el .pt en CPU
  aceleracion: auto
  objetos_cada_n_frames: 3     # el detector de objetos corre 1 de cada N frames (2 = detecta mejor, más lento)
  # Vocabulario abierto (YOLO-World): reconoce objetos por su nombre (ropa, saco, tablet…), no solo las
  # 80 clases de COCO. Se prepara una vez, con internet:  python scripts/preparar_vocabulario.py
  # Si el archivo no existe, se usa el detector de COCO de arriba.
  vocabulario_abierto: true
  objetos_abierto: models/vigia-vocabulario.pt
  confianza_objetos_abierto: 0.15
  vocabulario:                 # inglés (lo que entiende el modelo): español (lo que se muestra). Agregue lo que necesite
    person: persona            # no borrar: evita que la ropa puesta se lea como «ropa»
    backpack: mochila
    handbag: bolso
    suitcase: maleta
    sack: saco
    plastic bag: bolsa
    cardboard box: caja
    clothes: ropa
    jacket: ropa               # casacas, chompas y polerones: «clothes» solo no basta para el detector
    sweater: ropa
    hoodie: ropa
    coat: ropa
    laptop: laptop
    cell phone: celular
    tablet: tablet
    camera: cámara
    headphones: audífonos
    wallet: billetera
    bicycle: bicicleta
    motorcycle: motocicleta
    car: auto
    knife: cuchillo
    baseball bat: bate
  rostros: models/face_detection_yunet_2023mar.onnx
  emociones: models/facial_expression_recognition_mobilefacenet_2022july.onnx

procesamiento:
  fps_objetivo: 10             # frames analizados por segundo y por cámara
  # normal = lo de este archivo; rapido = imágenes más chicas para llegar a ~10 cuadros por segundo en vivo
  # en una laptop sin tarjeta gráfica (también: python -m vigia --rapido). Vea vigia/rendimiento.py
  perfil: normal
  rostros_cada_n_frames: 2     # YuNet busca rostros 1 de cada N cuadros; en los demás se difumina con la pose
  ancho_rostros: 480           # y los busca en una copia de este ancho (los rostros cercanos se ven igual)
  # Videos subidos: se analizan fps_objetivo cuadros por cada segundo de video, aunque la PC sea lenta (el video
  # se ve en cámara lenta, pero no se salta nada). Al terminar quedan en el último cuadro; ▶ los repite.
  repetir_videos: false        # true = vuelven a empezar solos (útil en una feria, sin nadie al lado)
  videos_detallado: true       # false = los videos subidos empiezan en «tiempo real» (como una cámara en vivo)
  objetos_cada_n_frames_videos: 2   # en los videos subidos el detector de objetos corre 1 de cada 2 cuadros
  # Segunda mirada (cámaras en vivo): si la PC analiza pocos cuadros por segundo, cuando hay algo que podría ser
  # un incidente rápido (dos personas juntas, un movimiento brusco) se vuelve a analizar cuadro a cuadro ese tramo,
  # guardado en memoria. Sus alertas llegan unos segundos tarde, pero no se pierden. Vea vigia/revision.py
  revision:
    activa: true
    solo_si_fps_menor_a: 8     # con 8 o más cuadros por segundo en vivo no hace falta
    antes: 4                   # segundos antes y después de la sospecha que se revisan
    despues: 3
    memoria: 15                # segundos que se guardan (unos 10 MB)
  ancho_max: 960               # se reduce el frame antes de analizarlo

privacidad:
  difuminar_rostros: true      # privacidad por diseño: activo por defecto
  solo_esqueleto: false        # borra a las personas de la imagen y deja solo su esqueleto (también en las capturas)
  analizar_emociones: false    # opcional: el artículo (PE3) muestra menor aceptación de funciones intrusivas
  dias_retencion_capturas: 7
  # Aviso de videovigilancia (página /aviso). La aceptación depende de la finalidad declarada y de
  # la confianza en quien gestiona los datos (artículo, sección 3.4): complete estos datos.
  finalidad: Prevenir y atender a tiempo agresiones, caídas, intrusiones y hurtos en las áreas vigiladas.
  responsable: "[Nombre de la institución responsable]"
  contacto: "[correo o teléfono para consultas y ejercicio de derechos]"

reglas:
  violencia:
    activa: true
    velocidad_extremidades: 1.8   # alturas/s de muñecas, codos y tobillos respecto del torso
    distancia_max: 1.2            # distancia entre personas (alturas)
    duracion_min: 0.6             # segundos sostenidos
    requiere_contacto: true       # una mano o un pie debe llegar al cuerpo de la otra persona
    agitacion_lenta: 0.11         # PC lenta (< 5 c/s): alturas que cambian de lugar manos y codos (golpes que no se ven)
    forcejeo:                     # cuerpo a cuerpo con empujones o tirones, aunque no haya golpes rápidos
      activa: true
      duracion: 1.5               # segundos con los cuerpos juntos (70 % del tiempo o más)
      brazos: 1.0                 # alturas/s de muñecas o codos, o bien...
      empuje: 0.35                # ...alturas/s que un cuerpo se mueve contra el otro sin separarse
      vaiven_lento: 0.04          # PC lenta: alturas de vaivén de un cuerpo respecto del otro
  caida:
    activa: true
    angulo_horizontal: 60         # grados del tronco respecto de la vertical
    puntos_cabeza_min: 3          # de los 5 puntos de la cabeza, cuántos deben verse (>= 0.3) para medir «cuerpo aplastado»;
                                  # con menos se mira el ángulo del tronco. 0 = siempre medir la cabeza (como antes)
    descenso_min: 0.35            # caída del centro de cadera (alturas) en <= 2.5 s
    en_suelo_alerta: 5            # segundos tendido para alerta de "persona en el suelo"
  merodeo:
    activa: true
    tiempo_max: 60                # segundos en una zona de merodeo
    sin_zonas: false              # si no hay zonas, medir en toda la cámara (genera muchas alertas en tiendas)
    tolerancia_salida: 2          # segundos fuera de la zona que no reinician la cuenta (temblor, pies en el borde)
  intrusion:
    activa: true                  # se dispara al entrar en una zona "restringida"
  objetos:
    activa: true
    tiempo_abandono: 30           # segundos inmóvil sin su dueño cerca
    distancia_dueno: 2.5          # alturas
    calentamiento: 10             # lo que se ve en los primeros N s es parte del escenario, no se abandona
    clases:                       # objetos que se vigilan; en una tienda de ropa conviene apagar maleta y bolso
      mochila: true
      bolso: true
      maleta: true
      bicicleta: true
      motocicleta: true
      auto: true
      cuchillo: true
      bate: true
  vehiculos:
    activa: true                  # robo de motos, bicicletas y autos estacionados
    tiempo_estacionado: 5         # segundos quieto para considerarlo estacionado
    tiempo_manipulacion: 3        # segundos que alguien distinto del dueño debe estar sobre él
    solape_min: 0.25              # fracción de la persona que debe quedar dentro del vehículo
  huida:
    activa: true                  # robo con huida: tocó a otra persona y salió corriendo
    velocidad: 1.6                # alturas/s del cuerpo (caminar ~0.7, correr > 1.6)
    ventana: 4                    # segundos después del contacto en que se vigila la huida
    separacion: 1.8               # alturas/s a las que se separan tras el contacto (sirve con la cámara en movimiento)
  arrebato:
    activa: true                  # le quitan a alguien un objeto que llevaba encima (en la mano o a la espalda)
    tiempo_porte: 1.5             # segundos que el dueño lo lleva encima antes del tirón
    cambio_min: 0.6               # segundos que la otra persona debe tenerlo sin el dueño
    distancia_mano: 0.45          # alturas entre la muñeca y el objeto para contar que lo sujeta
    separacion: 1.2               # alturas entre ambas personas para dar la alerta (si siguen juntas, no)
  vandalismo:
    activa: true                  # golpes contra un vehículo o una zona "protegida" sin nadie cerca
  armas:
    activa: true                  # cuchillo o bate en la mano (clases COCO del detector de objetos)
    distancia_mano: 0.3           # alturas entre el objeto y la muñeca
    detecciones_min: 2            # veces que debe verse en 2 s (evita errores de un frame)
  aglomeracion:
    activa: true
    max_personas: 15              # personas en la cámara para avisar aglomeración
    duracion: 5                   # segundos sostenidos
    min_corriendo: 4              # huida masiva: al menos N personas corriendo (y la mitad del total)
  emociones:
    alerta_enojo_miedo: false     # alerta si el enojo o miedo se sostiene
    duracion_min: 4

# Búsqueda de capturas en lenguaje natural con CLIP (opcional). Requiere: pip install -r requirements-busqueda.txt
# La primera vez descarga el modelo (~1.5 GB). El modelo multilingüe entiende consultas en español.
busqueda:
  activa: false
  modelo: xlm-roberta-base-ViT-B-32
  pesos: laion5b_s13b_b90k

alertas:
  enfriamiento: 30                # no repite la misma alerta de la misma persona antes de N s
  agrupar: 20                     # alertas del mismo tipo en la misma cámara dentro de N s se suman (×N) en una sola
                                  # (en modo feria no se agrupan: cada intento del reto es su propia alerta)
